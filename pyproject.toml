[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luminova"
version = "2.1.0"
description = "PHP Luminova Version Control Interface"
requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
luminova = "luminova.cli:main"